; /etc/php/8.4/fpm/conf.d/99-marcaturshub.ini and /etc/php/8.4/cli/conf.d/99-marcaturshub.ini
; (MH-OPS-006 reference)

expose_php = Off
display_errors = Off
log_errors = On

memory_limit = 256M
max_execution_time = 60

; Largest accepted upload is 20 MB (campaign / certification resources).
upload_max_filesize = 25M
post_max_size = 26M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Deploys reload PHP-FPM, so timestamp checks are unnecessary.
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
