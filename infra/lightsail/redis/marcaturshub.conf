# Settings to apply in /etc/redis/redis.conf  (MH-OPS-006 reference)
#
# Redis holds cache, sessions and the job queue. MySQL is the system of record.

bind 127.0.0.1 -::1
protected-mode yes
port 6379

# Set a long random value and copy it to REDIS_PASSWORD in shared/.env.
# requirepass <generated-at-provisioning>

# 2 GB host budget. volatile-lru only evicts keys with a TTL (cache, sessions),
# never queued jobs.
maxmemory 256mb
maxmemory-policy volatile-lru

# Periodic RDB snapshots are enough; queued jobs can be re-triggered.
save 900 1
save 300 10
