; /etc/supervisor/conf.d/marcaturshub.conf  (MH-OPS-006 reference)
;
; Exactly one queue worker, one scheduler and one Reverb server.
; Do NOT also add a cron `schedule:run` entry — that would run every job twice.
; Deploys restart the whole group: `supervisorctl restart marcaturshub:*`.

[group:marcaturshub]
programs=marcaturshub-queue,marcaturshub-scheduler,marcaturshub-reverb

[program:marcaturshub-queue]
command=/usr/bin/php /var/www/marcaturshub/current/artisan queue:work redis --sleep=1 --tries=3 --timeout=60 --max-time=3600
directory=/var/www/marcaturshub/current
user=www-data
numprocs=1
autostart=true
autorestart=true
; SIGTERM lets the worker finish its current job; must exceed --timeout.
stopwaitsecs=90
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/marcaturshub/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:marcaturshub-scheduler]
command=/usr/bin/php /var/www/marcaturshub/current/artisan schedule:work
directory=/var/www/marcaturshub/current
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/marcaturshub/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:marcaturshub-reverb]
command=/usr/bin/php /var/www/marcaturshub/current/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/marcaturshub/current
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/marcaturshub/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
