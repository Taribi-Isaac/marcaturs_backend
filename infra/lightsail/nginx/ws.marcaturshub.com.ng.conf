# /etc/nginx/sites-available/ws.marcaturshub.com.ng  (MH-OPS-006 reference)
#
# Browser wss://ws.marcaturshub.com.ng → Nginx :443 (TLS) → Reverb on 127.0.0.1:8080.
# Port 8080 is never opened in the Lightsail firewall. Reverb enforces
# REVERB_ALLOWED_ORIGINS; channel auth stays on api.* (/api/broadcasting/auth).
# Laravel also publishes events here (REVERB_HOST:443 → /apps/{id}/events).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ws.marcaturshub.com.ng;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ws.marcaturshub.com.ng;

    ssl_certificate     /etc/letsencrypt/live/api.marcaturshub.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.marcaturshub.com.ng/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/ws.access.log;
    error_log  /var/log/nginx/ws.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Longer than Reverb's 60s ping interval so idle sockets are not cut.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
