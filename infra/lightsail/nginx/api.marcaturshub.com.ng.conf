# /etc/nginx/sites-available/api.marcaturshub.com.ng  (MH-OPS-006 reference)
#
# Internet → Nginx :443 (TLS) → PHP-FPM 8.4 (unix socket) → Laravel.
# DNS for api.* is DNS-only (grey cloud) initially; certificates from Let's Encrypt
# (`certbot --nginx -d api.marcaturshub.com.ng -d ws.marcaturshub.com.ng`).

# Reject requests for hosts we do not serve (Host-header spoofing, IP scans).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.marcaturshub.com.ng;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 ships Nginx 1.24, which predates the separate `http2 on;` directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.marcaturshub.com.ng;

    ssl_certificate     /etc/letsencrypt/live/api.marcaturshub.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.marcaturshub.com.ng/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /var/www/marcaturshub/current/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Largest accepted upload is 20 MB (campaign / certification resources).
    client_max_body_size 25m;

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log warn;

    # If api.* is later switched to Cloudflare proxy (orange cloud), restore the
    # real client IP first, otherwise rate limits key on Cloudflare addresses:
    #   include /etc/nginx/snippets/cloudflare-real-ip.conf;  # set_real_ip_from <CF ranges>; real_ip_header CF-Connecting-IP;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        # Resolve the `current` symlink so OPcache sees each release as new files.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;

        # Laravel trusts proxies at '*' (bootstrap/app.php). Nginx is the only proxy,
        # so overwrite client-supplied forwarding headers with values Nginx knows.
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_FORWARDED "";
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_PREFIX "";

        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
