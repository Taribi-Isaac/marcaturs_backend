name: Backend checks

# MH-OPS-007D-R5 — the production pipeline's quality gate (Pint + PHPUnit), defined once.
#
# workflow_call  → production.yml job "test" (push to main / manual dispatch)
# pull_request   → the same checks for every PR to main, before merge
#
# This workflow has no secrets, no GitHub Environment, no deploy or SSH steps and a
# read-only token, so a pull request can never deploy, migrate or reach production.

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  checks:
    name: Pint + PHPUnit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record the commit under test
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo "### Backend checks"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo "- Checked-out commit: \`$(git rev-parse HEAD)\`"
            if [ -n "$PR_HEAD_SHA" ]; then
              echo "- Pull request head: \`$PR_HEAD_SHA\` (checked-out commit is the merge of head into base \`$PR_BASE_SHA\`)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, pdo_sqlite, pdo_mysql, redis, bcmath, intl, zip
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Style
        run: vendor/bin/pint --test
      - name: Run tests
        run: php artisan test
